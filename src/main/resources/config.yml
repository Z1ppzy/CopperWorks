# ─────────────────────────────────────────────
#  CopperWorks — профессии для медных големов
# ─────────────────────────────────────────────
# Нанять голема: Shift + ПКМ пустой рукой по медному голему,
# который стоит рядом с медным сундуком.
#
# Уровни улучшений: 0 (базовый) → 3. Списки ниже — значения для уровней 0, 1, 2, 3.

settings:
  # Как часто (в тиках) плагин проверяет рабочих. 5 тиков = 0.25 сек.
  tick-interval: 5
  # Сколько рабочих големов может быть у одного игрока. -1 — без лимита.
  # Право copperworks.unlimited снимает лимит.
  max-workers-per-player: 5
  # Как далеко от голема (в блоках) искать медный сундук — его рабочее место.
  post-search-radius: 2
  # Нанятых големов может бить только владелец.
  protect-workers: true
  # Нанятый голем не превращается в статую, даже когда полностью окислится.
  prevent-statue: true
  # Летающие предметы, анимации и частицы.
  visual-effects: true
  # Чем платить за улучшения и сколько стоят уровни 1, 2, 3.
  upgrade-item: COPPER_INGOT
  upgrade-costs: [16, 48, 128]
  # Прибавка к скорости работы за каждый уровень «Скорости» (0.5 = +50%).
  speed-per-level: 0.5
  # Множитель скорости в зависимости от окисления голема.
  # Ось снимает окисление, соты останавливают его.
  oxidation-speed:
    unaffected: 1.0
    exposed: 0.85
    weathered: 0.65
    oxidized: 0.4

jobs:
  sorter:
    enabled: true
    # Пауза между переносами при скорости ×1 (в тиках).
    base-interval-ticks: 40
    # Сколько предметов переносит за раз.
    items-per-move: [8, 16, 32, 64]
    # Радиус поиска сундуков вокруг медного сундука.
    radius: [8, 12, 16, 24]
    # Если для предмета нет рамки-фильтра — класть в сундук без фильтра,
    # где такой предмет уже лежит (как ванильный голем).
    match-existing: true
    # Группы: рамка с любым предметом из группы принимает всю группу.
    # Например, рамка с дубовым бревном принимает любые брёвна.
    group-filters:
      - minecraft:logs
      - minecraft:planks
      - minecraft:wool
      - minecraft:saplings
      - minecraft:leaves
      - minecraft:terracotta
      - minecraft:coals
      - minecraft:arrows
  courier:
    enabled: true
    # Скорость курьера в блоках в секунду (при скорости ×1).
    blocks-per-second: 4.0
    # Минимальная длительность одного плеча рейса (сек).
    min-leg-seconds: 5
    # Сколько стаков берёт в один рейс.
    stacks-per-trip: [1, 3, 6, 9]
    # Максимальная дистанция доставки. -1 — без ограничений (в пределах мира).
    max-distance: [256, 1024, 4096, -1]
    # Писать владельцу в action bar о доставке.
    notify-owner: true
  farmer:
    enabled: true
    base-interval-ticks: 30
    # Сколько созревших растений собирает за раз.
    crops-per-action: [1, 2, 3, 4]
    # Радиус поля вокруг голема.
    radius: [4, 6, 8, 10]
    # Насколько выше/ниже голема искать растения.
    vertical-range: 2
