# ─────────────────────────────────────────────
#  CopperWorks — профессии для медных големов
# ─────────────────────────────────────────────
# Нанять голема: Shift + ПКМ пустой рукой по медному голему,
# который стоит рядом с медным сундуком.
#
# Уровни улучшений: 0 (базовый) → 3. Списки ниже — значения для уровней 0, 1, 2, 3.

settings:
  # Как часто (в тиках) плагин проверяет рабочих. 5 тиков = 0.25 сек.
  tick-interval: 5
  # Сколько рабочих големов может быть у одного игрока. -1 — без лимита.
  # Право copperworks.unlimited снимает лимит.
  max-workers-per-player: 5
  # Как далеко от голема (в блоках) искать медный сундук — его рабочее место.
  post-search-radius: 2
  # Нанятых големов может бить только владелец.
  protect-workers: true
  # Нанятый голем не превращается в статую, даже когда полностью окислится.
  prevent-statue: true
  # Летающие предметы, анимации и частицы (в том числе эффект нового уровня).
  visual-effects: true
  # Подробные логи в консоль: каждый перенос, рейс, начисление опыта, нажатие в меню.
  # Переменная окружения LOG_LEVEL=debug (или info) важнее этой настройки.
  debug: false
  # Чем платить за улучшения и сколько стоят уровни 1, 2, 3.
  upgrade-item: COPPER_INGOT
  upgrade-costs: [16, 48, 128]
  # Прибавка к скорости работы за каждый уровень «Скорости» (0.5 = +50%).
  speed-per-level: 0.5
  # Множитель скорости в зависимости от окисления голема.
  # Ось снимает окисление, соты останавливают его.
  oxidation-speed:
    unaffected: 1.0
    exposed: 0.85
    weathered: 0.65
    oxidized: 0.4

jobs:
  sorter:
    enabled: true
    # Пауза между переносами при скорости ×1 (в тиках).
    base-interval-ticks: 40
    # Сколько предметов переносит за раз.
    items-per-move: [8, 16, 32, 64]
    # Радиус поиска сундуков вокруг медного сундука.
    radius: [8, 12, 16, 24]
    # Если для предмета нет рамки-фильтра — класть в сундук без фильтра,
    # где такой предмет уже лежит (как ванильный голем).
    match-existing: true
    # Группы: рамка с любым предметом из группы принимает всю группу.
    # Например, рамка с дубовым бревном принимает любые брёвна.
    group-filters:
      - minecraft:logs
      - minecraft:planks
      - minecraft:wool
      - minecraft:saplings
      - minecraft:leaves
      - minecraft:terracotta
      - minecraft:coals
      - minecraft:arrows
  courier:
    enabled: true
    # Скорость курьера в блоках в секунду (при скорости ×1).
    blocks-per-second: 4.0
    # Минимальная длительность одного плеча рейса (сек).
    min-leg-seconds: 5
    # Сколько стаков берёт в один рейс.
    stacks-per-trip: [1, 3, 6, 9]
    # Максимальная дистанция доставки. -1 — без ограничений (в пределах мира).
    max-distance: [256, 1024, 4096, -1]
    # Писать владельцу в action bar о доставке.
    notify-owner: true
    # Рамки с предметами на медном сундуке курьера: возить только такие вещи
    # (группы из jobs.sorter.group-filters тоже работают). Без рамок курьер возит всё.
    frame-filter: true
  farmer:
    enabled: true
    base-interval-ticks: 30
    # Сколько созревших растений собирает за раз.
    crops-per-action: [1, 2, 3, 4]
    # Радиус поля вокруг голема.
    radius: [4, 6, 8, 10]
    # Насколько выше/ниже голема искать растения.
    vertical-range: 2

# ─────────────────────────────────────────────
#  Опыт и уровни
# ─────────────────────────────────────────────
experience:
  enabled: true
  # Уровни голема: от 1 до max-level.
  max-level: 10
  # Сколько опыта нужно, чтобы перейти с уровня L на L+1: base × L^exponent.
  # По умолчанию: 100, 283, 520, 800, 1118, 1470, 1852, 2263, 2700 — всего около 11 100 до 10 уровня.
  curve:
    base: 100
    exponent: 1.5
  # Опыт за работу. Можно дробные числа.
  gain:
    # Сортировщик: за каждый перенесённый предмет.
    sorter-per-item: 1.0
    # Курьер: за каждый доставленный предмет...
    courier-per-item: 0.5
    # ...плюс бонус за рейс: base + дистанция × per-block (4096 бл. = 5 + 205 опыта).
    courier-trip-base: 5
    courier-trip-per-block: 0.05
    # Фермер: за каждое собранное растение.
    farmer-per-crop: 4
  # Сколько опыта голем может набрать за час (считается от первого опыта в этом часе).
  # Не даёт прокачать сортировщика за минуты, гоняя предметы по кругу через воронки. 0 — без лимита.
  max-per-hour: 2000
  # На каких уровнях голем получает случайную черту характера.
  trait-levels: [3, 6, 9]

# ─────────────────────────────────────────────
#  Черты характера
# ─────────────────────────────────────────────
# Черта остаётся при смене профессии, но действует только в своей.
# weight — относительный шанс выпадения (0 — не выпадает, но у кого уже есть, работает).
# enabled: false — черта не выпадает и не действует.
# Взаимоисключающие пары: «Ленивый» не сочетается с «Быстроногим» и «Неутомимым».
traits:
  enabled: true
  # Сколько черт может быть у одного голема.
  max-per-golem: 3
  # Переобучение в меню голема: перебросить одну черту. Платится тем же предметом, что и улучшения (upgrade-item).
  reroll:
    enabled: true
    cost: 32
  # «Быстроногий»: время рейса курьера × trip-time (0.75 = −25%).
  swift:
    enabled: true
    weight: 10
    trip-time: 0.75
  # «Грузчик»: курьер берёт больше стаков, сортировщик переносит больше предметов за раз.
  porter:
    enabled: true
    weight: 10
    courier-extra-stacks: 1
    sorter-items-multiplier: 1.5
  # «Аккуратный»: сортировщик пересканирует сундуки чаще (× rescan-multiplier к паузе между сканами)
  # и сначала раскладывает вещи, для которых есть рамка-фильтр (точный фильтр раньше группового).
  tidy:
    enabled: true
    weight: 10
    rescan-multiplier: 0.5
  # «Жадный»: фермер с этим шансом получает +1 предмет урожая с растения.
  greedy:
    enabled: true
    weight: 10
    extra-drop-chance: 0.2
  # «Неутомимый»: пауза между действиями любой профессии × pause-multiplier.
  tireless:
    enabled: true
    weight: 8
    pause-multiplier: 0.85
  # «Нержавейка»: штраф окисления к скорости × oxidation-penalty-multiplier (0.5 — вдвое меньше).
  stainless:
    enabled: true
    weight: 8
    oxidation-penalty-multiplier: 0.5
  # «Дальнозоркий»: + блоков к радиусу сортировщика и фермера.
  farsighted:
    enabled: true
    weight: 8
    extra-radius: 2
  # «Ленивый, но надёжный»: скорость × speed-multiplier, но вместимость как у улучшения
  # на capacity-levels уровней выше (выше III уровня значение продолжает последний шаг).
  lazy:
    enabled: true
    weight: 6
    speed-multiplier: 0.9
    capacity-levels: 1
