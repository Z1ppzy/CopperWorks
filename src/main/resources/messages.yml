# Все тексты плагина. Формат — MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Плейсхолдеры в <угловых скобках> подставляет плагин.

prefix: "<#d97a4a><bold>CopperWorks</bold></#d97a4a> <dark_gray>»</dark_gray> "

no-permission: "<red>Недостаточно прав."
not-owner: "<red>Этот голем работает на <yellow><owner></yellow>."
too-far: "<red>Голем слишком далеко."
golem-gone: "<red>Голем больше недоступен."

hire:
  no-post: "<red>Поставь голема рядом с медным сундуком (не дальше <radius> бл.): это будет его рабочее место."
  limit: "<red>У тебя уже максимум рабочих големов: <max>."
  job-disabled: "<red>Эта профессия отключена на сервере."
  already: "<red>У этого голема уже есть работа."
  success: "<green>Голем нанят! Профессия: <yellow><job></yellow>."

fire:
  success: "<yellow>Голем уволен и снова свободен."
  on-trip: "<red>Курьер в пути. Дождись, когда он вернётся."

job-changed: "<green>Новая профессия: <yellow><job></yellow>."

upgrade:
  max: "<yellow>Это улучшение уже на максимуме."
  not-enough: "<red>Нужно <cost> × <item>."
  success: "<green>«<upgrade>» улучшено до уровня <level>."

link:
  start: "<aqua>Нажми ПКМ по сундуку, бочке или шалкеру: туда курьер будет возить вещи. <gray>(<seconds> сек.)"
  not-container: "<red>Это не контейнер. Выбор отменён."
  same-post: "<red>Это рабочий сундук самого курьера. Выбери другой контейнер."
  no-access: "<red>У тебя нет доступа к этому контейнеру."
  other-world: "<red>Точка доставки должна быть в том же мире."
  too-far: "<red>Слишком далеко: <distance> бл. Сейчас максимум <max> бл., улучши дальность."
  success: "<green>Точка доставки: <x> <y> <z> (<distance> бл.)."
  expired: "<gray>Выбор точки доставки отменён."

courier:
  delivered: "<#d97a4a>Курьер доставил <amount> предм. в <x> <y> <z>."
  partial: "<yellow>Курьер доставил <amount> предм., ещё <left> не влезло. Везёт обратно."
  no-target: "<red>Курьер не нашёл контейнер в <x> <y> <z>. Везёт груз обратно."

death: "<red>Твой голем (<job>) погиб на <x> <y> <z>."

progress:
  level-up: "<green>Твой голем (<job>) достиг уровня <yellow><level></yellow>!"
  level-max: "<gold>Твой голем (<job>) достиг максимального уровня <level>!"
  trait-gained: "<gold>Новая черта: <yellow><trait></yellow></gold> <gray>— <desc>"

reroll:
  disabled: "<red>Переобучение отключено на сервере."
  changed: "<red>Черты голема уже изменились. Открой меню заново."
  no-options: "<yellow>Нет черт, на которые можно заменить «<trait>»."
  success: "<green>Голем забыл черту «<old>» и получил новую: <yellow><new></yellow> <gray>— <desc>"

trait:
  swift:
    name: "Быстроногий"
    desc: "Курьер: время рейса −<percent>%."
  porter:
    name: "Грузчик"
    desc: "Курьер: +<stacks> ст. за рейс. Сортировщик: +<percent>% предметов за перенос."
  tidy:
    name: "Аккуратный"
    desc: "Сортировщик: пересканирует сундуки в <times> раза чаще и сначала раскладывает вещи по сундукам с фильтрами."
  greedy:
    name: "Жадный"
    desc: "Фермер: шанс <chance>% получить с растения ещё один предмет урожая."
  tireless:
    name: "Неутомимый"
    desc: "Пауза между действиями короче на <percent>% в любой профессии."
  stainless:
    name: "Нержавейка"
    desc: "Окисление замедляет работу на <percent>% меньше."
  farsighted:
    name: "Дальнозоркий"
    desc: "Сортировщик и фермер: +<blocks> бл. к радиусу."
  lazy:
    name: "Ленивый, но надёжный"
    desc: "Работает на <percent>% медленнее, но вместимость как у улучшения на <levels> ур. выше."

command:
  help: |-
    <#d97a4a><bold>CopperWorks</bold></#d97a4a> <gray>— профессии для медных големов</gray>
    <gray>Нанять голема: <white>Shift + ПКМ</white> пустой рукой по медному голему рядом с медным сундуком.</gray>
    <white>/cw list</white> <gray>— сколько у тебя рабочих</gray>
    <white>/cw reload</white> <gray>— перезагрузить конфиг (админ)</gray>
    <white>/cw xp \<количество></white> <gray>— дать опыт голему, на которого смотришь (админ)</gray>
  list: "Рабочих големов: <yellow><count></yellow><gray>/<max></gray>"
  list-unlimited: "без лимита"
  reloaded: "<green>Конфиг и сообщения перезагружены."
  xp-no-golem: "<red>Посмотри на нанятого голема (не дальше 8 блоков)."
  xp-disabled: "<red>Опыт отключён: experience.enabled в config.yml."
  xp-given: "<green>Голему засчитано <amount> опыта: уровень <yellow><level></yellow>, опыт <xp>/<need>."
  xp-max: "<gold>Голем на максимальном уровне <level>."

job:
  sorter:
    name: "Сортировщик"
    desc: "Раскладывает вещи из медного сундука по сундукам вокруг. Фильтр: рамка с предметом на сундуке."
  courier:
    name: "Курьер"
    desc: "Возит вещи из медного сундука в выбранный контейнер на любом расстоянии. Рамки с предметами на медном сундуке ограничивают, что возить."
  farmer:
    name: "Фермер"
    desc: "Собирает созревший урожай вокруг, пересаживает и складывает в медный сундук."

upgrade-name:
  speed: "Скорость"
  capacity: "Вместимость"
  range: "Дальность"

values:
  speed: "×<value>"
  sorter-capacity: "<value> предм. за раз"
  courier-capacity: "<value> ст. за рейс"
  farmer-capacity: "<value> раст. за раз"
  radius: "радиус <value> бл."
  distance: "до <value> бл."
  unlimited: "без ограничений"

oxidation:
  unaffected: "блестящая"
  exposed: "потемневшая"
  weathered: "выветренная"
  oxidized: "окисленная"
  waxed: " <gray>(под воском)</gray>"

status:
  starting: "<gray>Осматривается…"
  working: "<green>Работает"
  idle: "<gray>Ждёт предметы в медном сундуке"
  nothing-to-sort: "<yellow>Некуда разложить. Добавь рамки-фильтры или сундуки рядом"
  nothing-ripe: "<gray>Ждёт, пока созреет урожай"
  storage-full: "<red>Медный сундук заполнен"
  no-post: "<red>Рядом нет медного сундука"
  no-target: "<yellow>Не указана точка доставки"
  too-far: "<red>Точка доставки слишком далеко"
  other-world: "<red>Точка доставки в другом мире"
  waiting-cargo: "<gray>Ждёт груз в медном сундуке"
  nothing-to-send: "<yellow>В медном сундуке нет вещей под рамки-фильтры"
  on-trip: "<aqua>Везёт груз, осталось <time>"
  returning: "<aqua>Возвращается, осталось <time>"
  disabled: "<red>Профессия отключена на сервере"

dialog:
  close: "Закрыть"
  back: "Назад"
  hire:
    title: "Медный голем"
    body: "Этот голем свободен. Выбери ему профессию: он будет работать у ближайшего медного сундука."
  manage:
    title: "<job> · CopperWorks"
    info: |-
      <gray>Владелец:</gray> <owner>
      <gray>Сейчас:</gray> <status>
      <gray>Медь:</gray> <oxidation> <gray>· скорость работы</gray> <speed>%
      <gray>Улучшения:</gray> скорость <lvl_speed>/3 · вместимость <lvl_capacity>/3 · дальность <lvl_range>/3
      <gray>Всего перенесено:</gray> <moved> предм.
    sorter-info: "<gray>Сундуков в радиусе <radius> бл.:</gray> <targets> <gray>· из них с фильтрами:</gray> <filtered>"
    courier-info: "<gray>Доставка:</gray> <target> <gray>· за рейс:</gray> <stacks> ст. <gray>· возит:</gray> <filter>"
    courier-filter-all: "все вещи"
    courier-filter-frames: "только из рамок (<count>)"
    courier-no-target: "<yellow>не указана</yellow>"
    farmer-info: "<gray>Растений в радиусе <radius> бл.:</gray> <crops>"
    experience: "<gray>Уровень:</gray> <yellow><level></yellow><gray>/<max></gray>  <bar>  <gray><xp>/<need> опыта</gray>"
    experience-max: "<gray>Уровень:</gray> <gold><level>/<max> — максимум</gold>"
    xp-capped: "<dark_gray>Лимит опыта на этот час набран, опыт снова пойдёт через <time>.</dark_gray>"
    xp-bar: "<#d97a4a><filled></#d97a4a><dark_gray><empty></dark_gray>"
    # Символы полосы опыта: заполненный и пустой сегмент (без тегов MiniMessage).
    xp-bar-filled: "▮"
    xp-bar-empty: "▯"
    traits-title: "<gray>Черты характера:</gray>"
    traits-empty: "<dark_gray>пока нет</dark_gray>"
    trait-line: "<yellow>• <trait></yellow> <gray>— <desc></gray>"
    trait-line-inactive: "<dark_gray>• <trait> — <desc> (не действует в этой профессии)</dark_gray>"
    trait-line-disabled: "<dark_gray><st>• <trait></st> — <desc> (черта отключена на сервере)</dark_gray>"
    trait-next: "<dark_gray>Следующая черта — на <level> уровне.</dark_gray>"
    upgrade-button: "<upgrade> <level> → <next>"
    upgrade-button-max: "<upgrade>: максимум"
    upgrade-tooltip: |-
      Цена: <cost> × <item>
      Сейчас: <current>
      Будет: <future>
    upgrade-tooltip-max: "Сейчас: <current>"
    change-job: "Сменить профессию"
    set-target: "Точка доставки"
    set-target-tooltip: "Нажми, затем кликни ПКМ по сундуку, бочке или шалкеру."
    fire: "Уволить"
    reroll: "Переобучение"
    reroll-tooltip: |-
      Голем забудет одну черту и получит случайную новую.
      Цена: <cost> × <item>
    tip: "<dark_gray>Окисленный голем работает медленнее. Ось снимает окисление, соты его останавливают."
  change-job:
    title: "Новая профессия"
  fire:
    title: "Уволить голема?"
    body: "Голем перестанет работать и снова станет обычным медным големом. Уровень, опыт и черты пропадут."
    confirm: "Уволить"
    cancel: "Отмена"
  reroll:
    title: "Переобучение"
    body: "Какую черту голем забудет? Взамен выпадет случайная новая: без повторов и несовместимых пар. Цена: <cost> × <item>."
  reroll-confirm:
    title: "Переобучить голема?"
    body: "Голем забудет черту «<trait>» и получит случайную новую. Цена: <cost> × <item>."
    confirm: "Переобучить"
    cancel: "Отмена"
